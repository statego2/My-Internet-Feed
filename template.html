<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161512">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F6F3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Internet Feed">
<link rel="icon" href="__FAVICON_SVG__" type="image/svg+xml">
<link rel="apple-touch-icon" href="__APPLE_TOUCH__">
<link rel="manifest" href="manifest.webmanifest">
<title>__TITLE__</title>
<style>
/*__FONTS__*/
:root{
  --bg:#161512; --text:#F6F6F3; --muted:#9A958C;
  --accent:#8EAAD9; --accent-hover:#A8C0E4;
  --gold:#C4A35A; --gold-line:#9A7840;
  --line:rgba(246,246,243,.12); --line-soft:rgba(246,246,243,.07);
  --panel:#1E1C18; --card:#1C1A16; --thumb:#12110F;
  --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  --pad:clamp(1.1rem,3.6vw,2.75rem);
  --header-h:auto;
  --radius:2px;
  --live:#C4473A;
}
html[data-theme="light"]{
  --bg:#F6F6F3; --text:#121212; --muted:#5A5A5A;
  --accent:#1B4F9C; --accent-hover:#163F7C;
  --gold:#9A7840; --gold-line:#C4A35A;
  --line:rgba(18,18,18,.14); --line-soft:rgba(18,18,18,.08);
  --panel:#EDECE7; --card:#EFEDE8; --thumb:#E7E5DF;
  --live:#B3261E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1.02rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal;
  padding-bottom:env(safe-area-inset-bottom)}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.2) blur(14px);backdrop-filter:saturate(1.2) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:calc(.85rem + env(safe-area-inset-top)) var(--pad) .85rem}
.top{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0;margin:0;color:inherit}
.mark{flex:none;width:1.85rem;height:1.85rem;display:block;border-radius:3px}
.wordmark{font-family:var(--serif);font-weight:400;font-size:clamp(1.45rem,3.2vw,1.85rem);letter-spacing:-.02em;line-height:1}
.gen{margin-left:auto;color:var(--muted);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;align-self:center}
.theme{margin-left:.2rem;flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;align-self:center}
.theme:hover{color:var(--text)}
.theme svg{width:18px;height:18px}
html[data-theme="light"] .icon-sun{display:none}
html[data-theme="dark"] .icon-moon{display:none}

.bar{display:flex;align-items:center;gap:.15rem 1.4rem;margin-top:.85rem;overflow-x:auto;scrollbar-width:none;padding:.15rem 0 .2rem}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:0;background:none;color:var(--muted);padding:.45rem 0;min-height:44px;
  font-size:.95rem;cursor:pointer;user-select:none;white-space:nowrap;position:relative;letter-spacing:.01em;transition:color .3s}
.chip::after{content:"";position:absolute;left:0;right:0;bottom:.35rem;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.chip:hover{color:var(--text)}
.chip.on{color:var(--text)}
.chip.on::after{transform:scaleX(1)}
.chip.sos{letter-spacing:.08em;font-size:.8rem;text-transform:uppercase}
.chip.sos.on{color:var(--gold)}
#q{flex:0 1 14rem;min-width:7.5rem;margin-left:auto;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:.45rem 0;font-size:.92rem;color:var(--text);outline:none;border-radius:0;transition:border-color .3s}
#q:focus{border-bottom-color:var(--accent)}
#q::placeholder{color:var(--muted);font-style:italic;font-family:var(--serif)}

/* ---------- layout ---------- */
main{max-width:1440px;margin:0 auto;padding:.5rem var(--pad) 4.5rem}

section{margin-top:clamp(2rem,4.5vw,3.25rem)}
.gh{display:flex;align-items:flex-end;justify-content:space-between;gap:1.25rem;padding-bottom:1rem;
  border-bottom:1px solid var(--line);margin-bottom:1.25rem;flex-wrap:wrap}
.gh h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.55rem,2.5vw,2.05rem);letter-spacing:-.02em;line-height:1.1;margin:0}
.gh .n{color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-right:auto;padding-bottom:.15rem}
.btn{border:0;background:none;color:var(--accent);padding:.35rem 0;font-size:.9rem;font-weight:600;cursor:pointer;letter-spacing:.01em}
.btn:hover{color:var(--accent-hover)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(1.15rem,2vw,1.7rem) clamp(1rem,1.8vw,1.5rem)}

/* ---------- cards ---------- */
.card{position:relative;background:transparent;display:flex;flex-direction:column;transition:opacity .45s var(--ease),filter .45s var(--ease)}
.card.sos .th{box-shadow:0 0 0 1px var(--gold-line)}
.card.seen{opacity:.42;filter:saturate(.55)}
.card.seen:hover{opacity:.82;filter:saturate(.85)}
.card a.hit{color:inherit;text-decoration:none;display:flex;flex-direction:column;flex:1;min-width:0}
.th{position:relative;aspect-ratio:16/9;background:var(--thumb);border-radius:var(--radius);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
@media (prefers-reduced-motion:no-preference){
  .card:hover .th img{transform:scale(1.03)}
  .card[data-in]{transform:translateY(14px);animation:rise .85s var(--ease) forwards}
  .card[data-in]:not(.seen){opacity:0;animation:rise-fade .85s var(--ease) forwards}
}
@keyframes rise{to{transform:none}}
@keyframes rise-fade{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .card,.th img,.chip::after{transition:none;animation:none}
}

.dur{position:absolute;right:.5rem;bottom:.5rem;background:rgba(18,18,18,.82);color:#F6F6F3;
  border-radius:var(--radius);padding:.12rem .4rem;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  font-feature-settings:"tnum" 1,"lnum" 1;line-height:1.2}
.dur.live{background:var(--live);letter-spacing:.1em}
.tag{position:absolute;left:.5rem;top:.5rem;display:flex;gap:.35rem}
.tag span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;line-height:1;
  padding:.28rem .4rem;border-radius:var(--radius);background:rgba(18,18,18,.78);color:#F6F6F3}
.tag .s{background:rgba(18,18,18,.88);color:#E8C97A;border:1px solid var(--gold-line);padding:.22rem .45rem;letter-spacing:.12em}
.tag .r{background:transparent;border:1px solid rgba(246,246,243,.35);letter-spacing:.12em}

.bd{padding:.85rem 0 1.15rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.ti{font-family:var(--serif);font-weight:400;font-size:1.08rem;line-height:1.28;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:.82rem;letter-spacing:.01em}
.meta b{color:var(--text);font-weight:600;font-family:var(--sans)}

.acts{position:absolute;right:.45rem;top:.45rem;display:flex;gap:.35rem;opacity:0;transition:opacity .3s}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.acts button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(18,18,18,.62);color:#F6F6F3;
  font-size:14px;cursor:pointer;line-height:32px;padding:0;backdrop-filter:blur(6px)}
.acts button:hover{background:rgba(18,18,18,.82)}
.card.seen .acts .ck{background:var(--accent);color:var(--bg)}

.empty{color:var(--muted);padding:4rem 0;text-align:center;font-family:var(--serif);font-size:1.25rem}
footer{color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);margin-top:clamp(2.5rem,6vw,4rem);padding-top:1.5rem}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{color:var(--accent-hover)}
details{margin-top:.9rem}
summary{cursor:pointer;letter-spacing:.04em}
details div{margin-top:.6rem;line-height:1.6}

@media (max-width:620px){
  .grid{grid-template-columns:1fr;gap:1.15rem}
  .card{flex-direction:row;align-items:stretch;gap:0}
  .card a.hit{flex-direction:row;gap:.9rem}
  .th{width:44%;flex:none;aspect-ratio:16/9;align-self:flex-start}
  .bd{padding:.1rem .15rem 2rem 0}
  .ti{font-size:1rem;-webkit-line-clamp:3}
  .acts{opacity:1;top:auto;bottom:.05rem;right:0;position:absolute}
  .acts button{width:34px;height:34px;line-height:34px;background:transparent;color:var(--muted);backdrop-filter:none}
  html[data-theme="dark"] .acts button{color:var(--muted)}
  .card.seen .acts .ck{background:transparent;color:var(--accent)}
  .tag span,.dur{transform:scale(.94);transform-origin:bottom right}
  .gen{margin-left:0;width:100%;order:3;letter-spacing:.1em}
  .theme{margin-left:auto}
  .mark{width:1.65rem;height:1.65rem}
  .bar{gap:.15rem 1.1rem}
}
@media (min-width:621px) and (max-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
</style>
<script>
(function(){try{var t=localStorage.getItem('mif_theme');if(t)document.documentElement.setAttribute('data-theme',t);
else document.documentElement.setAttribute('data-theme',matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}
catch(e){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
</head>
<body>
<header>
  <div class="top">
    <h1 class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mark" aria-hidden="true">
  <rect rx="4" fill="#1B4F9C"/>
  <path d="M15.5 16.910256410256412V14.5H30.935897435897434V16.910256410256412L26.628205128205128 17.371794871794872Q26.576923076923077 20.55128205128205 26.55128205128205 23.807692307692307Q26.525641025641026 27.064102564102566 26.525641025641026 30.397435897435898V32.6025641025641Q26.525641025641026 35.833333333333336 26.55128205128205 39.08974358974359Q26.576923076923077 42.34615384615385 26.628205128205128 45.62820512820513L30.935897435897434 46.08974358974359V48.5H15.5V46.08974358974359L19.807692307692307 45.62820512820513Q19.91025641025641 42.44871794871795 19.91025641025641 39.16666666666667Q19.91025641025641 35.88461538461539 19.91025641025641 32.6025641025641V30.397435897435898Q19.91025641025641 27.166666666666668 19.91025641025641 23.91025641025641Q19.91025641025641 20.653846153846153 19.807692307692307 17.371794871794872Z" fill="#F6F6F3"/>
  <rect x="29.84" y="20.70" width="24.5" height="2.35" rx="0.4" fill="#C4A35A"/>
  <rect x="29.84" y="30.10" width="18.5" height="2.35" rx="0.4" fill="#C4A35A"/>
  <rect x="29.84" y="39.50" width="12.5" height="2.35" rx="0.4" fill="#C4A35A"/>
</svg><span class="wordmark">My Internet Feed</span></h1>
    <span class="gen" id="gen"></span>
    <button class="theme" id="theme" type="button" aria-label="Αλλαγή θέματος" title="Αλλαγή θέματος">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.6M12 19.4V21M4.9 4.9l1.1 1.1M18 18l1.1 1.1M3 12h1.6M19.4 12H21M4.9 19.1 6 18M18 6l1.1-1.1"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 13.5A7.5 7.5 0 1 1 10.5 4 6 6 0 0 0 20 13.5z"/></svg>
    </button>
  </div>
  <nav class="bar" id="bar" aria-label="Φίλτρα"></nav>
</header>
<main id="main"></main>
<script id="d" type="application/json">/*__DATA__*/null</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent.replace(/^\/\*__DATA__\*\//,''));
const mem={};
const st={get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return mem[k]??def}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let seen=st.get('mif_seen',{}), hidden=st.get('mif_hidden',{});
let ui=Object.assign({unread:false,sos:false,hid:false,group:'all',q:''},st.get('mif_ui',{}));
ui.q='';
const save=()=>{st.set('mif_seen',seen);st.set('mif_hidden',hidden);st.set('mif_ui',ui)};
const now=Date.now();
for(const k in seen) if(now-seen[k]>60*864e5) delete seen[k];
for(const k in hidden) if(now-hidden[k]>60*864e5) delete hidden[k];

const chById={};D.channels.forEach(c=>chById[c.id]=c);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=s=>{if(!s)return'';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const rtf=new Intl.RelativeTimeFormat('el',{numeric:'auto'});
function ago(iso){const diff=(new Date(iso)-Date.now())/1000;const a=Math.abs(diff);
  if(a<3600)return rtf.format(Math.round(diff/60),'minute');
  if(a<86400)return rtf.format(Math.round(diff/3600),'hour');
  return rtf.format(Math.round(diff/86400),'day')}
const dateLbl=iso=>new Date(iso).toLocaleDateString('el-GR',{day:'numeric',month:'short',timeZone:'Europe/Athens'});
const thumb=u=>(u||'').replace('/mqdefault.jpg','/hqdefault.jpg');

document.getElementById('gen').textContent='Ενημερώθηκε  '+D.generated_label;
const themeBtn=document.getElementById('theme');
const applyThemeColor=()=>{const dark=document.documentElement.getAttribute('data-theme')!=='light';
  const c=dark?'#161512':'#F6F6F3';
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{if(!m.hasAttribute('media'))m.setAttribute('content',c)})};
applyThemeColor();
themeBtn.addEventListener('click',()=>{
  const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('mif_theme',next)}catch(e){}
  applyThemeColor();
});

function bar(){
  const el=document.getElementById('bar');
  const g=[['all','Όλα'],...D.groups];
  const short=s=>s.split(' &')[0].split(',')[0];
  el.innerHTML=g.map(([k,l])=>`<button type="button" class="chip ${ui.group===k?'on':''}" data-g="${k}">${esc(short(l))}</button>`).join('')+
   `<button type="button" class="chip sos ${ui.sos?'on':''}" data-t="sos">SOS</button>`+
   `<button type="button" class="chip ${ui.unread?'on':''}" data-t="unread">Μόνο αδιάβαστα</button>`+
   `<button type="button" class="chip ${ui.hid?'on':''}" data-t="hid">Κρυμμένα</button>`+
   `<input type="search" id="q" placeholder="Αναζήτηση" value="${esc(ui.q)}" autocomplete="off">`;
}
function card(v,i){
  const c=chById[v.chid]||{};const isSeen=!!seen[v.id];
  return `<article class="card ${c.sos?'sos':''} ${isSeen?'seen':''}" data-id="${esc(v.id)}" data-in style="animation-delay:${Math.min(i,10)*55}ms">
   <a class="hit" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">
    <div class="th"><img loading="lazy" src="${esc(thumb(v.thumb))}" alt="">
      <div class="tag">${c.sos?'<span class="s">★ SOS</span>':''}${v.platform==='rumble'?'<span class="r">Rumble</span>':''}</div>
      ${v.live?'<span class="dur live">Live</span>':(v.dur?`<span class="dur">${fmtDur(v.dur)}</span>`:'')}
    </div>
    <div class="bd"><div class="ti">${esc(v.title)}</div>
     <div class="meta"><b>${esc(v.ch)}</b> · ${dateLbl(v.date)} · ${ago(v.date)}</div></div>
   </a>
   <div class="acts"><button class="ck" data-a="seen" title="το είδα" aria-label="το είδα">✓</button><button data-a="hide" title="${hidden[v.id]?'Εμφάνιση':'Κρύψιμο'}" aria-label="κρύψιμο">${hidden[v.id]?'↺':'✕'}</button></div>
  </article>`;
}
function render(){
  bar();
  const q=ui.q.trim().toLowerCase();
  let html='';let total=0;
  const stale=new Set(D.stale||[]);
  for(const [gk,gl] of D.groups){
    if(ui.group!=='all'&&ui.group!==gk)continue;
    let vs=D.videos.filter(v=>{const c=chById[v.chid];return c&&c.group===gk});
    vs=vs.filter(v=>ui.hid?!!hidden[v.id]:!hidden[v.id]);
    if(ui.sos)vs=vs.filter(v=>chById[v.chid].sos);
    if(ui.unread)vs=vs.filter(v=>!seen[v.id]);
    if(q)vs=vs.filter(v=>(v.title+' '+v.ch).toLowerCase().includes(q));
    vs.sort((a,b)=>(chById[b.chid].sos-chById[a.chid].sos)||(new Date(b.date)-new Date(a.date)));
    if(!vs.length)continue;
    total+=vs.length;
    const unread=vs.filter(v=>!seen[v.id]).length;
    html+=`<section><div class="gh"><h2>${esc(gl)}</h2><span class="n">${unread} αδιάβαστα / ${vs.length}</span><button class="btn" data-mark="${gk}" type="button">Όλα ως ειδωμένα</button></div><div class="grid">${vs.map(card).join('')}</div></section>`;
  }
  if(!total)html+='<div class="empty">Δεν υπάρχει τίποτα να δείξω με αυτά τα φίλτρα.</div>';
  const withVids=new Set(D.videos.map(v=>v.chid));
  const quiet=D.channels.filter(c=>!withVids.has(c.id));
  html+=`<footer>`;
  if(quiet.length)html+=`<details><summary>Χωρίς νέα τις τελευταίες ${D.days} ημέρες (${quiet.length})</summary><div>${quiet.map(c=>esc(c.title)).join(' · ')}</div></details>`;
  if(stale.size)html+=`<div style="margin-top:.8rem">Παλιά δεδομένα, δεν φορτώθηκαν: ${[...stale].map(i=>esc((chById[i]||{}).title||i)).join(', ')}</div>`;
  html+=`<div style="margin-top:.8rem">Το «το είδα» και το κρύψιμο μένουν σε αυτή τη συσκευή.</div></footer>`;
  document.getElementById('main').innerHTML=html;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-g],[data-t],[data-a],[data-mark],a.hit');if(!t)return;
  if(t.dataset.g){ui.group=t.dataset.g;save();render();return}
  if(t.dataset.t){ui[t.dataset.t]=!ui[t.dataset.t];save();render();return}
  if(t.dataset.mark){const k=t.dataset.mark;D.videos.forEach(v=>{if(chById[v.chid].group===k&&!hidden[v.id])seen[v.id]=Date.now()});save();render();return}
  const cardEl=t.closest('.card');if(!cardEl)return;const id=cardEl.dataset.id;
  if(t.dataset.a==='seen'){e.preventDefault();if(seen[id])delete seen[id];else seen[id]=Date.now();save();cardEl.classList.toggle('seen',!!seen[id]);if(ui.unread)render();return}
  if(t.dataset.a==='hide'){e.preventDefault();if(hidden[id])delete hidden[id];else hidden[id]=Date.now();save();render();return}
  if(t.matches('a.hit')){seen[id]=Date.now();save();cardEl.classList.add('seen');if(ui.unread)setTimeout(render,400)}
});
document.addEventListener('auxclick',e=>{const a=e.target.closest('a.hit');if(a){const c=a.closest('.card');seen[c.dataset.id]=Date.now();save();c.classList.add('seen')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const p=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}});
render();
</script>
</body>
</html>
