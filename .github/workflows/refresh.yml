# Rebuild the GitHub Pages site (branch main, folder /docs) every 3 hours.
# One failed source does not fail the job: build.py keeps that channel's previous items.
name: refresh-feed

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: pip install playwright && playwright install --with-deps chromium

      - name: Build feed
        run: python3 build.py

      - name: Commit and push when the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/index.html docs/data.json
          if git diff --cached --quiet; then
            echo "No changes in docs/index.html or docs/data.json."
            exit 0
          fi
          git commit -m "Refresh feed"
          git push
