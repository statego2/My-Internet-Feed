# Rebuild the GitHub Pages site (branch main, folder /docs) every 30 minutes.
# One failed source does not fail the job: build.py keeps that channel's previous items.
name: refresh-feed

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: pip install playwright && playwright install --with-deps chromium

      - name: Build feed
        run: python3 build.py

      - name: Commit and push when the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/index.html docs/data.json docs/tv/index.html
          if git diff --cached --quiet; then
            echo "No changes in docs/index.html, docs/data.json, or docs/tv/index.html."
            exit 0
          fi
          git commit -m "Refresh feed"
          git push
