html,body{margin:0;background:#161512;color:#F6F6F3;
  font-family:"Source Sans 3","Source Sans Pro",Helvetica,Arial,sans-serif;}
header{display:flex;align-items:center;justify-content:space-between;
  padding:28px 48px 8px;}
.brand{display:flex;align-items:center;margin:0;min-width:0;}
.mark{width:72px;height:72px;display:block;border-radius:6px;flex:none;}
.wordmark{margin-left:18px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-weight:400;font-size:42px;letter-spacing:-0.02em;}
.gen{color:#9A958C;font-size:20px;letter-spacing:0.08em;text-transform:uppercase;}
.row{margin:8px 0 18px;}
.row h2{margin:0 48px 12px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-weight:400;font-size:32px;}
.strip{position:relative;white-space:nowrap;overflow-x:hidden;padding:8px 48px 20px;}
a.card{display:inline-block;width:420px;margin:0 22px 0 0;vertical-align:top;white-space:normal;
  color:inherit;text-decoration:none;background:#1C1A16;border-radius:2px;outline:none;}
a.card:focus{outline:5px solid #C4A35A;outline-offset:6px;transform:scale(1.03);}
.thumb{position:relative;width:100%;padding-top:56.25%;background:#12110F;overflow:hidden;}
.thumb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;}
.sos{position:absolute;left:12px;top:12px;z-index:1;background:#1B4F9C;color:#C4A35A;
  font-size:16px;letter-spacing:0.14em;padding:4px 10px;}
.bd{padding:16px 18px 20px;}
.ti{margin:0 0 10px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-size:32px;font-weight:400;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.meta{margin:0;color:#9A958C;font-size:22px;line-height:1.35;}
.meta b{color:#F6F6F3;font-weight:600;}
.empty{margin:0;padding:48px;color:#9A958C;font-size:28px;}
html.locked #feed{display:none;}
html.open #gate{display:none;}
#gate{position:fixed;left:0;top:0;right:0;bottom:0;background:#161512;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pin{margin:0 0 18px;font-size:28px;letter-spacing:0.28em;}
.dots{margin:0 0 28px;min-height:36px;font-size:32px;letter-spacing:0.45em;color:#C4A35A;}
#gate.bad .dots{color:#C4473A;}
.keys{display:grid;grid-template-columns:repeat(3,140px);grid-gap:16px;}
.keys button{height:108px;font:inherit;font-size:40px;color:#F6F6F3;background:#1C1A16;
  border:0;border-radius:2px;cursor:pointer;}
.keys button:focus{outline:5px solid #C4A35A;outline-offset:4px;transform:scale(1.04);}
#stage{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:30;}
#stage.off{display:none;}
#stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;}
#play{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;
  font-size:72px;line-height:180px;text-align:center;background:#1B4F9C;color:#C4A35A;
  border:0;border-radius:8px;z-index:2;}
#play.off{display:none;}
#play:focus{outline:5px solid #C4A35A;outline-offset:6px;}
@media (max-width:1600px){
  header{padding:22px 32px 4px;}
  .mark{width:60px;height:60px;}
  .wordmark{font-size:36px;}
  .row h2{margin-left:32px;margin-right:32px;font-size:28px;}
  .strip{padding:8px 32px 16px;}
  a.card{width:360px;}
  .ti{font-size:26px;}
  .meta{font-size:20px;}
  .keys{grid-template-columns:repeat(3,112px);grid-gap:12px;}
  .keys button{height:88px;font-size:34px;}
}
</style>
</head>

</div>

    }
    if (code === 13) {
      var play = document.getElementById('play');
      if (play.className.indexOf('off') !== -1) {
        e.preventDefault();
        ytCmd(ytPlaying ? 'pauseVideo' : 'playVideo');
        ytPlaying = !ytPlaying;
      }
    }
    return;
  }
  if (!isOpen()) {
    var digit = -1;
    if (code >= 48 && code <= 57) digit = code - 48;
    else if (code >= 96 && code <= 105) digit = code - 96;
    else if (!code && e.key && e.key.length === 1 && e.key >= '0' && e.key <= '9') digit = e.key;
    if (digit !== -1 && digit !== '-1') {
      e.preventDefault();
      addDigit(String(digit));
      return;
    }
    if (code >= 37 && code <= 40) {
      e.preventDefault();
      move(keys(), code);
      return;
    }
    if (code === 13) {
      e.preventDefault();
      var cur = document.activeElement;
      if (cur && cur.click) cur.click();
    }
    return;
  }
  if (code >= 37 && code <= 40) {
    e.preventDefault();
    moveCard(code);
    return;
  }
  if (code === 13) {
    var card = document.activeElement;
    if (!card || !card.getAttribute) return;
    var href = card.getAttribute('href') || '';
    if (href.indexOf('https://www.youtube.com/watch') === 0) {
      e.preventDefault();
      openPlayer(card);
    } else if (card.href) {
      window.location.href = card.href;
    }
  }
});
if (isOpen()) {
  var firstCard = cards()[0];
  if (firstCard) firstCard.focus();
} else {
  var firstKey = keys()[0];
  if (firstKey) firstKey.focus();
}
</script>
</body>
</html>
