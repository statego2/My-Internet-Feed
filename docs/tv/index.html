function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function videoUrl(v) {
  if (v.platform === 'youtube') {
    var id = String(v.id || '');
    if (id.indexOf('yt:') === 0) id = id.substring(3);
    return 'https://www.youtube.com/watch?v=' + id;
  }
  return String(v.url || '');
}
function age(iso) {
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.round((Date.now() - t) / (60 * 1000));
  if (mins < 1) return 'μόλις τώρα';
  if (mins < 60) return 'πριν από ' + mins + (mins === 1 ? ' λεπτό' : ' λεπτά');
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return 'πριν από ' + hrs + (hrs === 1 ? ' ώρα' : ' ώρες');
  var days = Math.round(hrs / 24);
  return 'πριν από ' + days + (days === 1 ? ' ημέρα' : ' ημέρες');
}
function thumb(v) {
  var url=String(v.thumb || '');
  if(v.platform==='youtube') {
    if(!url && /^yt:[A-Za-z0-9_-]{11}$/.test(v.id)) url='https://i.ytimg.com/vi/'+v.id.substring(3)+'/mqdefault.jpg';
    return url.replace('/hqdefault.jpg','/mqdefault.jpg').replace('/maxresdefault.jpg','/mqdefault.jpg').replace('/sddefault.jpg','/mqdefault.jpg');

  var asos = (chById[a.chid] && chById[a.chid].sos) ? 1 : 0;

  if (asos !== bsos) return bsos - asos;

function loadVisibleThumbs() {
  thumbPending = false;

  if(!isOpen() || stageOpen()) return;
  var images = document.getElementById('grid').querySelectorAll('img[data-src]');
  var bottom = window.innerHeight + 160;
  for (var i=0;i<images.length;i++) {
    var img=images[i], r=img.getBoundingClientRect();
    if (r.bottom >= -200 && r.top <= bottom) {
      img.src=img.getAttribute('data-src');
      img.removeAttribute('data-src');
    }
  }
}

function renderFeed() {
  var buttons=categoryButtons(), g, n;
  for (var i=0;i<buttons.length;i++) {
    var active=buttons[i].getAttribute('data-group')===selectedGroup;
    buttons[i].className=active?'active':'';
    buttons[i].setAttribute('aria-pressed',active?'true':'false');
  }
  var known={};
  feedBuckets=[];
  feedTotal=0;
  renderedCount=0;
  for(g=0;g<groups.length;g++) {
    var gid=groups[g][0];
    known[gid]=true;
    if(selectedGroup!=='all'&&selectedGroup!==gid) continue;
    var bucket=[];
    for(n=0;n<videos.length;n++) if((chById[videos[n].chid]||{}).group===gid) bucket.push(videos[n]);
    if(bucket.length) feedBuckets.push({label:groups[g][1],videos:bucket.sort(rowSort),node:null,count:0});
  }
  if(selectedGroup==='all') {
    var other=videos.filter(function(v){return !known[(chById[v.chid]||{}).group];}).sort(rowSort);
    if(other.length) feedBuckets.push({label:'Άλλα',videos:other,node:null,count:0});
  }
  for(g=0;g<feedBuckets.length;g++) feedTotal+=feedBuckets[g].videos.length;
  document.getElementById('grid').innerHTML='';
  if(!feedTotal) {
    document.getElementById('grid').innerHTML='<p class="empty">Δεν υπάρχουν βίντεο.</p>';
    return;
  }
  appendCards();
}
function appendCards() {
  var grid=document.getElementById('grid');
  var more=document.getElementById('moreVideos');
  if(more) grid.removeChild(more);
  for(var k=0;k<feedBuckets.length&&renderedCount<shownLimit;k++) {
    var b=feedBuckets[k], html='';
    if(b.count>=b.videos.length) continue;
    if(!b.node) {
      var section=document.createElement('section');
      section.className='row';
      section.innerHTML='<h2>'+esc(b.label)+'</h2><div class="video-grid"></div>';
      grid.appendChild(section);
      b.node=section.lastChild;
    }
    while(b.count<b.videos.length&&renderedCount<shownLimit) {
      html+=cardHtml(b.videos[b.count++]);
      renderedCount++;
    }
    if(html) b.node.insertAdjacentHTML('beforeend',html);
  }
  if(renderedCount<feedTotal) {
    more=document.createElement('button');
    more.type='button';more.className='more';more.id='moreVideos';
    more.textContent='Περισσότερα ('+renderedCount+' / '+feedTotal+')';
    grid.appendChild(more);
  }
  loadVisibleThumbs();
}
function showMore() {
  if(renderedCount>=feedTotal) return;
  var oldCount=renderedCount;
  shownLimit+=PAGE_SIZE;
  appendCards();

}

function move(all, dir) {
  var cur = document.activeElement;
  var inside = false;

  if (!inside) {
    if (all.length) all[0].focus();

    var b = el.getBoundingClientRect();
    var dx = (b.left + b.width / 2) - cx;
    var dy = (b.top + b.height / 2) - cy;
    if (dir === 37 && dx >= -4) continue;

    if (dir === 38 && dy >= -4) continue;
    if (dir === 40 && dy <= 4) continue;
    var primary = (dir === 37 || dir === 39) ? Math.abs(dx) : Math.abs(dy);

function focusCard(el) {

  var r = el.getBoundingClientRect();
  var top = categoryBar.getBoundingClientRect().bottom + 12;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  if (r.top < top) window.scrollTo(0, Math.max(0, y + r.top - top));

function moveCard(dir) {
  var cur = document.activeElement, all = cards(), buttons = categoryButtons();
  var inNav = cur && cur.parentNode === categoryBar;
  if (inNav) {
    if (dir === 37 || dir === 39) {
      var i = Array.prototype.indexOf.call(buttons, cur);
      var next = buttons[i + (dir === 39 ? 1 : -1)];
      if (next) next.focus();

    var b = el.getBoundingClientRect(), dx = b.left + b.width/2 - cx, dy = b.top + b.height/2 - cy;
    if ((dir === 37 && dx >= -4) || (dir === 39 && dx <= 4) ||

    if (d < score) { score = d; best = el; }
  }
  if (best) focusCard(best);

var returnCard = null, playerHistory = false, returnScroll = 0, warmed = false;
function warmPlayer() {

  link.rel='preconnect';link.href='https://www.youtube-nocookie.com';

var stage = document.getElementById('stage');

function safeRumbleEmbed(url) {

}
function playerSource(card) {

  if(href.indexOf('https://www.youtube.com/watch')===0) {
    var id=ytIdFrom(href);
    if(id) return {name:'YouTube',url:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&controls=1&fs=1&disablekb=0&playsinline=1'};
  }

}

}
function fullscreenElement() {

document.addEventListener('keydown', function (e) {

    else if (e.key === 'ArrowUp') code = 38;
    else if (e.key === 'ArrowRight') code = 39;

  }

    var digit = -1;

      move(keys(), code);

    if (code === 13) {

// Poll the published snapshot without interrupting playback or the PIN screen.

  var old = document.activeElement, href = old && old.getAttribute && old.getAttribute('href');
  var y = window.pageYOffset || 0;

function refreshTV() {
  applyTV();
  if(tvBusy || document.hidden) return;

  xhr.open('GET','../data.json?t='+Date.now(),true);
  xhr.timeout=15000;
  xhr.onload=function(){
