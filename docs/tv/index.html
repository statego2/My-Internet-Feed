<script>
var D = JSON.parse(document.getElementById('d').textContent.replace(/^\/\*__DATA__\*\//, ''));
if (!D || !D.videos) D = {videos: [], channels: [], generated_label: ''};

var chById = {};
var channels = D.channels || [];
for (var i = 0; i < channels.length; i++) chById[channels[i].id] = channels[i];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function videoUrl(v) {
  if (v.platform === 'youtube') {
    var id = String(v.id || '');
    if (id.indexOf('yt:') === 0) id = id.substring(3);
    return 'https://www.youtube.com/watch?v=' + id;
  }
  return String(v.url || '');
}
function age(iso) {
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.round((Date.now() - t) / (60 * 1000));
  if (mins < 1) return 'μόλις τώρα';
  if (mins < 60) return 'πριν από ' + mins + (mins === 1 ? ' λεπτό' : ' λεπτά');
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return 'πριν από ' + hrs + (hrs === 1 ? ' ώρα' : ' ώρες');
  var days = Math.round(hrs / 24);
  return 'πριν από ' + days + (days === 1 ? ' ημέρα' : ' ημέρες');
}
function thumb(v) {
  return String(v.thumb || '').replace('/mqdefault.jpg', '/hqdefault.jpg');
}

function rowSort(a, b) {
  var asos = (chById[a.chid] && chById[a.chid].sos) ? 1 : 0;
  var bsos = (chById[b.chid] && chById[b.chid].sos) ? 1 : 0;
  if (asos !== bsos) return bsos - asos;
  var ad = String(a.date || ''), bd = String(b.date || '');
  if (ad < bd) return 1;
  if (ad > bd) return -1;
  return 0;
}
function duration(v) {
  if (v.live) return 'LIVE';
  var n = Math.floor(Number(v.dur) || 0);
  if (n <= 0) return '';
  var h = Math.floor(n / 3600), m = Math.floor(n / 60) % 60, sec = n % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}
function cardHtml(v) {
  var ch = chById[v.chid] || {};
  var mark = ch.sos ? '<span class="sos">SOS</span>' : '';
  var dur = duration(v);
  return '<a class="card" href="' + esc(videoUrl(v)) + '">' +
    '<div class="thumb"><img loading="lazy" alt="" data-src="' + esc(thumb(v)) + '">' + mark +
    (dur ? '<span class="duration">' + esc(dur) + '</span>' : '') + '</div>' +
    '<div class="bd"><p class="ti">' + esc(v.title) + '</p>' +
    '<p class="meta"><b>' + esc(v.ch || ch.title || '') + '</b> · ' + esc(age(v.date)) + '</p></div></a>';
}
var groups = D.groups || [];
var videos = D.videos || [];
var selectedGroup = 'all';
var shownLimit = 24;
var PAGE_SIZE = 24;
var feedTotal = 0;
var thumbPending = false;
var categoryBar = document.getElementById('categories');
var options = [['all','Όλα']].concat(groups);
var navHtml = '';
for (var g = 0; g < options.length; g++) {
  var label = String(options[g][1]).split(' &')[0].split(',')[0];
  navHtml += '<button type="button" data-group="' + esc(options[g][0]) + '">' + esc(label) + '</button>';
}
categoryBar.innerHTML = navHtml;
function categoryButtons() { return categoryBar.querySelectorAll('button'); }
function activeCategory() { return categoryBar.querySelector('.active'); }
function loadVisibleThumbs() {
  thumbPending = false;
  var images = document.getElementById('grid').querySelectorAll('img[data-src]');
  var bottom = window.innerHeight + 300;
  for (var i=0;i<images.length;i++) {
    var img=images[i], r=img.getBoundingClientRect();
    if (r.bottom >= -200 && r.top <= bottom) {
      img.src=img.getAttribute('data-src');
      img.removeAttribute('data-src');
    }
  }
}
function scheduleThumbs() {
  if (thumbPending || !isOpen() || stageOpen()) return;
  thumbPending=true; setTimeout(loadVisibleThumbs,60);
}
function renderFeed() {
  var buttons = categoryButtons();
  for (var i = 0; i < buttons.length; i++) {
    var active = buttons[i].getAttribute('data-group') === selectedGroup;
    buttons[i].className = active ? 'active' : '';
    buttons[i].setAttribute('aria-pressed', active ? 'true' : 'false');
  }
  var html='', known={}, buckets=[], total=0, left=shownLimit;
  for (var g=0;g<groups.length;g++) {
    var gid=groups[g][0];
    known[gid]=true;
    if (selectedGroup!=='all' && selectedGroup!==gid) continue;
    var bucket=[];
    for(var n=0;n<videos.length;n++) {
      if ((chById[videos[n].chid]||{}).group===gid) bucket.push(videos[n]);
    }
    if (bucket.length) buckets.push([groups[g][1],bucket.sort(rowSort)]);
  }
  if (selectedGroup==='all') {
    var other=videos.filter(function(v){return !known[(chById[v.chid]||{}).group];}).sort(rowSort);
    if(other.length) buckets.push(['Άλλα',other]);
  }
  for(var k=0;k<buckets.length;k++) {
    var list=buckets[k][1];
    total+=list.length;
    if(left<=0) continue;
    html+='<section class="row"><h2>'+esc(buckets[k][0])+'</h2><div class="video-grid">';
    for(var j=0;j<list.length&&left>0;j++,left--) html+=cardHtml(list[j]);
    html+='</div></section>';
  }
  feedTotal=total;
  if(total>shownLimit) html+='<button type="button" class="more" id="moreVideos">Περισσότερα ('+Math.min(shownLimit,total)+' / '+total+')</button>';
  document.getElementById('grid').innerHTML=html||'<p class="empty">Δεν υπάρχουν βίντεο.</p>';
  loadVisibleThumbs();
}
function showMore() {
  if(shownLimit>=feedTotal) return;
  var oldCount=cards().length;
  shownLimit+=PAGE_SIZE;
  renderFeed();
  var next=cards()[oldCount];
  if(next) focusCard(next);
}
window.addEventListener('scroll',scheduleThumbs);
window.addEventListener('resize',scheduleThumbs);
categoryBar.addEventListener('click', function(e) {
  var t = e.target;
  if (!t || !t.getAttribute || t.getAttribute('data-group') === null) return;
  selectedGroup = t.getAttribute('data-group');
  shownLimit = PAGE_SIZE;
  renderFeed();
  window.scrollTo(0,0);
  t.focus();

var PIN_SHA = '9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0';

function sha256ascii(ascii) {

      var a = hash[0], e = hash[4];

        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))

            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))

function isOpen() { return /(^|\s)open(\s|$)/.test(document.documentElement.className); }

document.getElementById('keys').addEventListener('click', function (e) {

  else if (t.getAttribute('data-act') === 'ok') submitPin();
});

function cards() {
  return document.querySelectorAll('a.card');
}
function keys() {
  return document.querySelectorAll('#keys button');
}
function move(all, dir) {
  var cur = document.activeElement;
  var inside = false;
  for (var n = 0; n < all.length; n++) if (all[n] === cur) inside = true;
  if (!inside) {
    if (all.length) all[0].focus();
    return;
  }
  var r = cur.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var best = null, bestD = 1e15;
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    if (el === cur) continue;
    var b = el.getBoundingClientRect();
    var dx = (b.left + b.width / 2) - cx;
    var dy = (b.top + b.height / 2) - cy;
    if (dir === 37 && dx >= -4) continue;
    if (dir === 39 && dx <= 4) continue;
    if (dir === 38 && dy >= -4) continue;
    if (dir === 40 && dy <= 4) continue;
    var primary = (dir === 37 || dir === 39) ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir === 37 || dir === 39) ? Math.abs(dy) : Math.abs(dx);
    var dist = primary + secondary * 1.5;
    if (dist < bestD) { bestD = dist; best = el; }
  }
  if (!best) return;
  best.focus();
}
function focusCard(el) {
  el.focus();
  var r = el.getBoundingClientRect();
  var top = categoryBar.getBoundingClientRect().bottom + 12;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  if (r.top < top) window.scrollTo(0, Math.max(0, y + r.top - top));
  else if (r.bottom > window.innerHeight - 14) window.scrollTo(0, y + r.bottom - window.innerHeight + 14);
}
function moveCard(dir) {
  var cur = document.activeElement, all = cards(), buttons = categoryButtons();
  var inNav = cur && cur.parentNode === categoryBar;
  if (inNav) {
    if (dir === 37 || dir === 39) {
      var i = Array.prototype.indexOf.call(buttons, cur);
      var next = buttons[i + (dir === 39 ? 1 : -1)];
      if (next) next.focus();
    } else if (dir === 40 && all.length) focusCard(all[0]);
    return;
  }
  if (!cur || !cur.classList || !cur.classList.contains('card')) {
    if (activeCategory()) activeCategory().focus();
    return;
  }
  var r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  var best = null, score = Infinity;
  for (var j = 0; j < all.length; j++) {
    var el = all[j];
    if (el === cur) continue;
    var b = el.getBoundingClientRect(), dx = b.left + b.width/2 - cx, dy = b.top + b.height/2 - cy;
    if ((dir === 37 && dx >= -4) || (dir === 39 && dx <= 4) ||
        (dir === 38 && dy >= -4) || (dir === 40 && dy <= 4)) continue;
    if ((dir === 37 || dir === 39) && Math.abs(dy) > r.height/2) continue;
    var d = dir === 37 || dir === 39 ? Math.abs(dx) + 3*Math.abs(dy) : Math.abs(dy) + 2*Math.abs(dx);
    if (d < score) { score = d; best = el; }
  }
  if (best) focusCard(best);
  else if (dir === 40 && shownLimit < feedTotal) showMore();
  else if (dir === 38 && activeCategory()) { window.scrollTo(0,0); activeCategory().focus(); }
}
var returnCard = null, playerHistory = false;
var stage = document.getElementById('stage');
var frame = document.getElementById('yt');
var toolbar = document.getElementById('playerTools');
var fullscreenButton = document.getElementById('playerFullscreen');
function stageOpen() { return stage && stage.className.indexOf('off') === -1; }
function ytIdFrom(href) {
  var match = String(href || '').match(/[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/);
  return match ? match[1] : '';
}
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || null;
}
function requestFullscreen() {
  var fn = stage.requestFullscreen || stage.webkitRequestFullscreen || stage.webkitRequestFullScreen;

}

}
function updateFullscreenLabel() {
  fullscreenButton.textContent = fullscreenElement() ? 'Έξοδος fullscreen' : 'Fullscreen';
}
document.addEventListener('fullscreenchange', updateFullscreenLabel);
document.addEventListener('webkitfullscreenchange', updateFullscreenLabel);
function showTools() { toolbar.classList.add('visible'); }
function hideTools() { toolbar.classList.remove('visible'); }
function focusNative() {
  hideTools();
  frame.focus();
  try { frame.contentWindow.focus(); } catch(e) {}
}
function openPlayer(card) {
  var id = ytIdFrom(card.getAttribute('href') || card.href);

  returnCard = card;
  document.documentElement.className = 'open playing';
  stage.className = '';
  frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&controls=1&fs=1&disablekb=0&playsinline=1';
  try { history.pushState({mifTVPlayer:true}, '', location.href); playerHistory = true; } catch(e) { playerHistory = false; }
  showTools();
  document.getElementById('playerControls').focus();
}
function closePlayer(fromHistory) {
  if (!stageOpen()) return;
  exitFullscreen();
  frame.src = 'about:blank';
  stage.className = 'off';
  hideTools();
  document.documentElement.className = 'open';
  if (returnCard) focusCard(returnCard);
  scheduleThumbs();
  if (!fromHistory && playerHistory && history.state && history.state.mifTVPlayer) history.back();
  playerHistory = false;
}
window.addEventListener('popstate', function() { if (stageOpen()) closePlayer(true); });

});
toolbar.addEventListener('focusin', showTools);

document.addEventListener('keydown', function (e) {

    }
  }
});
