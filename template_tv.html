<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161512">
<title>__TITLE__</title>
<script>
try {
  document.documentElement.className = localStorage.getItem('mif_tv_unlocked') === '1' ? 'open' : 'locked';
} catch (e) {
  document.documentElement.className = 'locked';
}
</script>
<style>
/*__FONTS__*/
html,body{margin:0;background:#161512;color:#F6F6F3;
  font-family:"Source Sans 3","Source Sans Pro",Helvetica,Arial,sans-serif;}
header{display:flex;align-items:center;justify-content:space-between;
  padding:28px 48px 8px;}
.brand{display:flex;align-items:center;margin:0;min-width:0;}
.mark{width:72px;height:72px;display:block;border-radius:6px;flex:none;}
.wordmark{margin-left:18px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-weight:400;font-size:42px;letter-spacing:-0.02em;}
.gen{color:#9A958C;font-size:20px;letter-spacing:0.08em;text-transform:uppercase;}
.row{margin:8px 0 18px;}
.row h2{margin:0 48px 12px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-weight:400;font-size:32px;}
.strip{position:relative;white-space:nowrap;overflow-x:hidden;padding:8px 48px 20px;}
a.card{display:inline-block;width:420px;margin:0 22px 0 0;vertical-align:top;white-space:normal;
  color:inherit;text-decoration:none;background:#1C1A16;border-radius:2px;outline:none;}
a.card:focus{outline:5px solid #C4A35A;outline-offset:6px;transform:scale(1.03);}
.thumb{position:relative;width:100%;padding-top:56.25%;background:#12110F;overflow:hidden;}
.thumb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;}
.sos{position:absolute;left:12px;top:12px;z-index:1;background:#1B4F9C;color:#C4A35A;
  font-size:16px;letter-spacing:0.14em;padding:4px 10px;}
.bd{padding:16px 18px 20px;}
.ti{margin:0 0 10px;font-family:"Source Serif 4","Source Serif Pro",Georgia,serif;
  font-size:32px;font-weight:400;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.meta{margin:0;color:#9A958C;font-size:22px;line-height:1.35;}
.meta b{color:#F6F6F3;font-weight:600;}
.empty{margin:0;padding:48px;color:#9A958C;font-size:28px;}
html.locked #feed{display:none;}
html.open #gate{display:none;}
#gate{position:fixed;left:0;top:0;right:0;bottom:0;background:#161512;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pin{margin:0 0 18px;font-size:28px;letter-spacing:0.28em;}
.dots{margin:0 0 28px;min-height:36px;font-size:32px;letter-spacing:0.45em;color:#C4A35A;}
#gate.bad .dots{color:#C4473A;}
.keys{display:grid;grid-template-columns:repeat(3,140px);grid-gap:16px;}
.keys button{height:108px;font:inherit;font-size:40px;color:#F6F6F3;background:#1C1A16;
  border:0;border-radius:2px;cursor:pointer;}
.keys button:focus{outline:5px solid #C4A35A;outline-offset:4px;transform:scale(1.04);}
#stage{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:30;}
#stage.off{display:none;}
#stage iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;}
#play{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;
  font-size:72px;line-height:180px;text-align:center;background:#1B4F9C;color:#C4A35A;
  border:0;border-radius:8px;z-index:2;}
#play.off{display:none;}
#play:focus{outline:5px solid #C4A35A;outline-offset:6px;}
@media (max-width:1600px){
  header{padding:22px 32px 4px;}
  .mark{width:60px;height:60px;}
  .wordmark{font-size:36px;}
  .row h2{margin-left:32px;margin-right:32px;font-size:28px;}
  .strip{padding:8px 32px 16px;}
  a.card{width:360px;}
  .ti{font-size:26px;}
  .meta{font-size:20px;}
  .keys{grid-template-columns:repeat(3,112px);grid-gap:12px;}
  .keys button{height:88px;font-size:34px;}
}
</style>
</head>
<body>
<div id="gate">
  <p class="pin">PIN</p>
  <p class="dots" id="dots">····</p>
  <div class="keys" id="keys">
    <button type="button" data-d="1">1</button>
    <button type="button" data-d="2">2</button>
    <button type="button" data-d="3">3</button>
    <button type="button" data-d="4">4</button>
    <button type="button" data-d="5">5</button>
    <button type="button" data-d="6">6</button>
    <button type="button" data-d="7">7</button>
    <button type="button" data-d="8">8</button>
    <button type="button" data-d="9">9</button>
    <button type="button" data-act="del" aria-label="Διαγραφή">⌫</button>
    <button type="button" data-d="0">0</button>
    <button type="button" data-act="ok">OK</button>
  </div>
</div>
<div id="feed">
<header>
  <h1 class="brand">__MARK__<span class="wordmark">__TITLE__</span></h1>
  <div class="gen" id="gen"></div>
</header>
<main id="grid"></main>
</div>
<div id="stage" class="off">
  <iframe id="yt" title="YouTube" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  <button type="button" id="play" aria-label="Αναπαραγωγή">▶</button>
</div>
<script id="d" type="application/json">/*__DATA__*/null</script>
<script>
var D = JSON.parse(document.getElementById('d').textContent.replace(/^\/\*__DATA__\*\//, ''));
if (!D || !D.videos) D = {videos: [], channels: [], generated_label: ''};

var chById = {};
var channels = D.channels || [];
for (var i = 0; i < channels.length; i++) chById[channels[i].id] = channels[i];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function videoUrl(v) {
  if (v.platform === 'youtube') {
    var id = String(v.id || '');
    if (id.indexOf('yt:') === 0) id = id.substring(3);
    return 'https://www.youtube.com/watch?v=' + id;
  }
  return String(v.url || '');
}
function age(iso) {
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.round((Date.now() - t) / (60 * 1000));
  if (mins < 1) return 'μόλις τώρα';
  if (mins < 60) return 'πριν από ' + mins + (mins === 1 ? ' λεπτό' : ' λεπτά');
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return 'πριν από ' + hrs + (hrs === 1 ? ' ώρα' : ' ώρες');
  var days = Math.round(hrs / 24);
  return 'πριν από ' + days + (days === 1 ? ' ημέρα' : ' ημέρες');
}
function thumb(v) {
  return String(v.thumb || '').replace('/mqdefault.jpg', '/hqdefault.jpg');
}

function rowSort(a, b) {
  var asos = (chById[a.chid] && chById[a.chid].sos) ? 1 : 0;
  var bsos = (chById[b.chid] && chById[b.chid].sos) ? 1 : 0;
  if (asos !== bsos) return bsos - asos;
  var ad = String(a.date || ''), bd = String(b.date || '');
  if (ad < bd) return 1;
  if (ad > bd) return -1;
  return 0;
}
function cardHtml(v) {
  var ch = chById[v.chid] || {};
  var mark = ch.sos ? '<span class="sos">SOS</span>' : '';
  return '<a class="card" href="' + esc(videoUrl(v)) + '">' +
    '<div class="thumb"><img alt="" src="' + esc(thumb(v)) + '">' + mark + '</div>' +
    '<div class="bd"><p class="ti">' + esc(v.title) + '</p>' +
    '<p class="meta"><b>' + esc(v.ch || ch.title || '') + '</b> · ' + esc(age(v.date)) + '</p></div></a>';
}
var groups = D.groups || [];
var html = '';
var videos = D.videos || [];
for (var g = 0; g < groups.length; g++) {
  var gid = groups[g][0], glabel = groups[g][1];
  var bucket = [];
  for (var n = 0; n < videos.length; n++) {
    var chg = chById[videos[n].chid] || {};
    if (chg.group === gid) bucket.push(videos[n]);
  }
  if (!bucket.length) continue;
  bucket.sort(rowSort);
  html += '<section class="row"><h2>' + esc(glabel) + '</h2><div class="strip">';
  for (var k = 0; k < bucket.length; k++) html += cardHtml(bucket[k]);
  html += '</div></section>';
}
document.getElementById('grid').innerHTML = html || '<p class="empty">Δεν υπάρχουν βίντεο.</p>';
document.getElementById('gen').textContent = D.generated_label || '';

var PIN_SHA = '9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0';
var pin = '';
var pinBusy = false;

function sha256ascii(ascii) {
  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }
  var maxWord = Math.pow(2, 32);
  var i, j, result = '', words = [], hash = [], k = [], primeCounter = 0, isComposite = {};
  var bitLength = ascii.length * 8;
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLength / maxWord) | 0;
  words[words.length] = bitLength;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
  }
  return result;
}
function sha256hex(text) {
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    var bytes;
    try {
      bytes = (window.TextEncoder ? new TextEncoder() : null);
      var data = bytes ? bytes.encode(text) : utf8bytes(text);
      return crypto.subtle.digest('SHA-256', data).then(function (buf) {
        var u = new Uint8Array(buf), hex = '';
        for (var i = 0; i < u.length; i++) hex += ((u[i] < 16) ? '0' : '') + u[i].toString(16);
        return hex;
      }, function () { return sha256ascii(text); });
    } catch (e) {}
  }
  return Promise.resolve(sha256ascii(text));
}
function utf8bytes(text) {
  var out = [];
  for (var i = 0; i < text.length; i++) {
    var c = text.charCodeAt(i);
    if (c < 128) out.push(c);
    else if (c < 2048) { out.push(192 | (c >> 6), 128 | (c & 63)); }
    else { out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  return new Uint8Array(out);
}
function isOpen() { return document.documentElement.className === 'open'; }
function paintPin() {
  var s = '';
  for (var i = 0; i < 4; i++) s += i < pin.length ? '●' : '·';
  document.getElementById('dots').textContent = s;
}
function addDigit(d) {
  if (pin.length >= 4) return;
  pin += d;
  paintPin();
}
function pinFail() {
  pin = '';
  paintPin();
  var g = document.getElementById('gate');
  g.className = 'bad';
  setTimeout(function () { g.className = ''; }, 700);
}
function submitPin() {
  if (pinBusy) return;
  pinBusy = true;
  sha256hex(pin).then(function (hex) {
    pinBusy = false;
    if (hex === PIN_SHA) {
      try { localStorage.setItem('mif_tv_unlocked', '1'); } catch (e) {}
      document.documentElement.className = 'open';
      var first = cards()[0];
      if (first) first.focus();
    } else pinFail();
  });
}
document.getElementById('keys').addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var d = t.getAttribute('data-d');
  if (d) addDigit(d);
  else if (t.getAttribute('data-act') === 'del') { pin = pin.slice(0, -1); paintPin(); }
  else if (t.getAttribute('data-act') === 'ok') submitPin();
});

function cards() {
  return document.querySelectorAll('a.card');
}
function keys() {
  return document.querySelectorAll('#keys button');
}
function move(all, dir) {
  var cur = document.activeElement;
  var inside = false;
  for (var n = 0; n < all.length; n++) if (all[n] === cur) inside = true;
  if (!inside) {
    if (all.length) all[0].focus();
    return;
  }
  var r = cur.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var best = null, bestD = 1e15;
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    if (el === cur) continue;
    var b = el.getBoundingClientRect();
    var dx = (b.left + b.width / 2) - cx;
    var dy = (b.top + b.height / 2) - cy;
    if (dir === 37 && dx >= -4) continue;
    if (dir === 39 && dx <= 4) continue;
    if (dir === 38 && dy >= -4) continue;
    if (dir === 40 && dy <= 4) continue;
    var primary = (dir === 37 || dir === 39) ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir === 37 || dir === 39) ? Math.abs(dy) : Math.abs(dx);
    var dist = primary + secondary * 1.5;
    if (dist < bestD) { bestD = dist; best = el; }
  }
  if (!best) return;
  best.focus();
}
function focusCard(el) {
  el.focus();
  var strip = el.parentNode;
  if (strip) {
    var left = el.offsetLeft - 48;
    if (left < 0) left = 0;
    strip.scrollLeft = left;
  }
  var top = el.getBoundingClientRect().top;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  if (top < 110 || top > window.innerHeight - 180) window.scrollTo(0, y + top - 150);
}
function moveCard(dir) {
  var cur = document.activeElement;
  if (!cur || !cur.className || cur.className.indexOf('card') === -1) {
    var all = cards();
    if (all.length) focusCard(all[0]);
    return;
  }
  var strip = cur.parentNode;
  var row = strip.querySelectorAll('a.card');
  var idx = -1;
  for (var i = 0; i < row.length; i++) if (row[i] === cur) idx = i;
  if (dir === 37 || dir === 39) {
    var side = row[idx + (dir === 39 ? 1 : -1)];
    if (side) focusCard(side);
    return;
  }
  var section = strip.parentNode;
  var dest = dir === 38 ? section.previousElementSibling : section.nextElementSibling;
  if (!dest || !dest.querySelector) return;
  var nextStrip = dest.querySelector('.strip');
  if (!nextStrip) return;
  var others = nextStrip.querySelectorAll('a.card');
  if (!others.length) return;
  var cx = cur.offsetLeft + cur.offsetWidth / 2;
  var best = others[0], bestD = 1e15;
  for (var j = 0; j < others.length; j++) {
    var dx = Math.abs((others[j].offsetLeft + others[j].offsetWidth / 2) - cx);
    if (dx < bestD) { bestD = dx; best = others[j]; }
  }
  focusCard(best);
}
var returnCard = null;
var ytPlaying = false;
function stageOpen() {
  return document.getElementById('stage').className.indexOf('off') === -1;
}
function ytIdFrom(href) {
  var i = String(href || '').indexOf('v=');
  if (i < 0) return '';
  var id = String(href).substring(i + 2);
  var amp = id.indexOf('&');
  if (amp >= 0) id = id.substring(0, amp);
  return id;
}
function ytCmd(func) {
  var frame = document.getElementById('yt');
  if (!frame || !frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage(JSON.stringify({event: 'command', func: func, args: []}), '*');
  } catch (err) {}
}
function openPlayer(card) {
  var id = ytIdFrom(card.getAttribute('href') || card.href);
  if (!id) return;
  returnCard = card;
  ytPlaying = false;
  var frame = document.getElementById('yt');
  var play = document.getElementById('play');
  document.getElementById('stage').className = '';
  play.className = '';
  frame.onload = function () {
    try { frame.contentWindow.postMessage('{"event":"listening","id":"yt"}', '*'); } catch (err) {}
  };
  frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1&enablejsapi=1&modestbranding=1';
  play.focus();
}
function closePlayer() {
  document.getElementById('yt').src = 'about:blank';
  document.getElementById('stage').className = 'off';
  if (returnCard && returnCard.focus) focusCard(returnCard);
}
window.addEventListener('message', function (e) {
  var origin = String(e.origin || '');
  if (origin.indexOf('youtube') < 0) return;
  var data = e.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (err) { return; }
  }
  if (!data || data.event !== 'onStateChange') return;
  var state = data.info;
  if (state && typeof state === 'object') state = state.playerState;
  if (state === 1) {
    ytPlaying = true;
    document.getElementById('play').className = 'off';
  } else if (state === 2) ytPlaying = false;
});
document.getElementById('play').addEventListener('click', function () {
  document.getElementById('play').className = 'off';
  ytCmd('playVideo');
  ytPlaying = true;
});
document.getElementById('grid').addEventListener('click', function (e) {
  var a = e.target;
  while (a && a.tagName !== 'A') a = a.parentNode;
  if (!a || !a.getAttribute) return;
  if (String(a.getAttribute('href') || '').indexOf('https://www.youtube.com/watch') === 0) {
    e.preventDefault();
    openPlayer(a);
  }
});
document.addEventListener('keydown', function (e) {
  var code = e.keyCode || e.which || 0;
  if (!code) {
    if (e.key === 'ArrowLeft') code = 37;
    else if (e.key === 'ArrowUp') code = 38;
    else if (e.key === 'ArrowRight') code = 39;
    else if (e.key === 'ArrowDown') code = 40;
    else if (e.key === 'Enter') code = 13;
    else if (e.key === 'Escape') code = 27;
    else if (e.key === 'Backspace') code = 8;
  }
  if (stageOpen()) {
    if (code === 461 || code === 27 || code === 8) {
      e.preventDefault();
      closePlayer();
      return;
    }
    if (code === 13) {
      var play = document.getElementById('play');
      if (play.className.indexOf('off') !== -1) {
        e.preventDefault();
        ytCmd(ytPlaying ? 'pauseVideo' : 'playVideo');
        ytPlaying = !ytPlaying;
      }
    }
    return;
  }
  if (!isOpen()) {
    var digit = -1;
    if (code >= 48 && code <= 57) digit = code - 48;
    else if (code >= 96 && code <= 105) digit = code - 96;
    else if (!code && e.key && e.key.length === 1 && e.key >= '0' && e.key <= '9') digit = e.key;
    if (digit !== -1 && digit !== '-1') {
      e.preventDefault();
      addDigit(String(digit));
      return;
    }
    if (code >= 37 && code <= 40) {
      e.preventDefault();
      move(keys(), code);
      return;
    }
    if (code === 13) {
      e.preventDefault();
      var cur = document.activeElement;
      if (cur && cur.click) cur.click();
    }
    return;
  }
  if (code >= 37 && code <= 40) {
    e.preventDefault();
    moveCard(code);
    return;
  }
  if (code === 13) {
    var card = document.activeElement;
    if (!card || !card.getAttribute) return;
    var href = card.getAttribute('href') || '';
    if (href.indexOf('https://www.youtube.com/watch') === 0) {
      e.preventDefault();
      openPlayer(card);
    } else if (card.href) {
      window.location.href = card.href;
    }
  }
});
if (isOpen()) {
  var firstCard = cards()[0];
  if (firstCard) firstCard.focus();
} else {
  var firstKey = keys()[0];
  if (firstKey) firstKey.focus();
}
</script>
</body>
</html>
