<style>
html,body{margin:0;background:#161512;color:#F6F6F3;
  font-family:"Source Sans 3","Source Sans Pro",Helvetica,Arial,sans-serif;}
header{display:flex;align-items:center;justify-content:space-between;

  font-weight:400;font-size:42px;letter-spacing:-0.02em;}

.video-grid{display:block;font-size:0;text-align:center;} .video-grid:after{content:'';display:block;clear:both;} .video-grid a.card{display:inline-block;vertical-align:top;width:23%;margin:0 .75% 20px;font-size:16px;text-align:left;box-sizing:border-box;} .more{display:block;margin:18px auto 28px;padding:12px 24px;font:inherit;font-size:22px;color:#F6F6F3;background:#25221d;border:1px solid #C4A35A;border-radius:5px;} .more:focus{outline:3px solid #C4A35A;outline-offset:3px;}

.sos{position:absolute;left:10px;top:10px;z-index:1;background:#1B4F9C;color:#C4A35A;font-size:16px;letter-spacing:0.12em;padding:4px 9px;}
.duration{position:absolute;right:8px;bottom:8px;background:#111;color:white;padding:3px 7px;font-size:16px;border-radius:3px;}

.meta{margin:0;color:#9A958C;font-size:19px;line-height:1.35;}
.meta b{color:#F6F6F3;font-weight:600;}
.empty{margin:0;padding:28px 0;color:#9A958C;font-size:26px;}
html.locked #feed{display:none;}
html.open #gate{display:none;}
#gate{position:fixed;left:0;top:0;right:0;bottom:0;background:#161512;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pin{margin:0 0 18px;font-size:28px;letter-spacing:0.28em;}
.dots{margin:0 0 28px;min-height:36px;font-size:32px;letter-spacing:0.45em;color:#C4A35A;}

.keys{display:grid;grid-template-columns:repeat(3,140px);grid-gap:16px;}

  border:0;border-radius:2px;cursor:pointer;}
.keys button:focus{outline:5px solid #C4A35A;outline-offset:4px;transform:scale(1.04);}
html.playing,html.playing body{overflow:hidden!important;overscroll-behavior:none;}
html.playing::-webkit-scrollbar,html.playing body::-webkit-scrollbar{display:none;width:0;height:0;}
html.playing #feed{display:none;}
#stage{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:30;overflow:hidden;}
#stage.off{display:none;}
#stage iframe{position:absolute;display:block;left:0;top:0;width:100%;height:100%;border:0;background:#000;}
.player-tools{position:absolute;right:14px;top:12px;z-index:2;display:flex;padding:6px;background:rgba(0,0,0,.85);border-radius:8px;visibility:hidden;pointer-events:none;}
.player-tools.visible,.player-tools:hover{visibility:visible;pointer-events:auto;}
.player-tools button{font:inherit;font-size:18px;background:#25221d;color:#fff;border:1px solid #777;border-radius:5px;padding:9px 13px;margin:0 3px;cursor:pointer;}
#revealTools{position:absolute;right:12px;top:8px;z-index:1;font:inherit;font-size:20px;background:rgba(0,0,0,.7);color:white;border:0;border-radius:4px;padding:6px 13px;cursor:pointer;}
#revealTools:focus{outline:3px solid white;} #stage.native #revealTools{opacity:0;} #stage.native #revealTools:hover,#stage.native #revealTools:focus{opacity:1;}
@media (max-width:1600px){
 header{padding:22px 32px 4px;}
 .mark{width:60px;height:60px;}
 .wordmark{font-size:36px;}
 #categories{padding:8px 32px;}
 #categories button{font-size:19px;padding:7px 13px;}
 #grid{padding:16px 32px 36px;}
  .video-grid a.card{width:31.5%;margin:0 .75% 18px;}

 .keys button{height:88px;font-size:34px;}
}

 #categories{padding:8px 16px;}

<script id="d" type="application/json">/*__DATA__*/null</script>
<script>
var D = JSON.parse(document.getElementById('d').textContent.replace(/^\/\*__DATA__\*\//, ''));
if (!D || !D.videos) D = {videos: [], channels: [], generated_label: ''};

var chById = {};
var channels = D.channels || [];
for (var i = 0; i < channels.length; i++) chById[channels[i].id] = channels[i];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function videoUrl(v) {
  if (v.platform === 'youtube') {
    var id = String(v.id || '');
    if (id.indexOf('yt:') === 0) id = id.substring(3);
    return 'https://www.youtube.com/watch?v=' + id;
  }
  return String(v.url || '');
}
function age(iso) {
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var mins = Math.round((Date.now() - t) / (60 * 1000));
  if (mins < 1) return 'μόλις τώρα';
  if (mins < 60) return 'πριν από ' + mins + (mins === 1 ? ' λεπτό' : ' λεπτά');
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return 'πριν από ' + hrs + (hrs === 1 ? ' ώρα' : ' ώρες');
  var days = Math.round(hrs / 24);
  return 'πριν από ' + days + (days === 1 ? ' ημέρα' : ' ημέρες');
}
function thumb(v) {
  var url=String(v.thumb || '');
  if(v.platform==='youtube') {
    if(!url && /^yt:[A-Za-z0-9_-]{11}$/.test(v.id)) url='https://i.ytimg.com/vi/'+v.id.substring(3)+'/mqdefault.jpg';
    return url.replace('/hqdefault.jpg','/mqdefault.jpg').replace('/maxresdefault.jpg','/mqdefault.jpg').replace('/sddefault.jpg','/mqdefault.jpg');
  }
  return url;
}

function rowSort(a, b) {
  var asos = (chById[a.chid] && chById[a.chid].sos) ? 1 : 0;
  var bsos = (chById[b.chid] && chById[b.chid].sos) ? 1 : 0;
  if (asos !== bsos) return bsos - asos;
  var ad = String(a.date || ''), bd = String(b.date || '');
  if (ad < bd) return 1;
  if (ad > bd) return -1;
  return 0;
}
function duration(v) {
  if (v.live) return 'LIVE';
  var n = Math.floor(Number(v.dur) || 0);
  if (n <= 0) return '';
  var h = Math.floor(n / 3600), m = Math.floor(n / 60) % 60, sec = n % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}
function cardHtml(v) {
  var ch = chById[v.chid] || {};
  var mark = ch.sos ? '<span class="sos">SOS</span>' : '';
  var dur = duration(v);
  var embed = v.platform === 'rumble' ? safeRumbleEmbed(v.embed_url) : '';
  return '<a class="card" href="' + esc(videoUrl(v)) + '"' + (embed ? ' data-embed="' + esc(embed) + '"' : '') + '>' +
    '<div class="thumb"><img loading="lazy" alt="" data-src="' + esc(thumb(v)) + '">' + mark +
    (dur ? '<span class="duration">' + esc(dur) + '</span>' : '') + '</div>' +
    '<div class="bd"><p class="ti">' + esc(v.title) + '</p>' +
    '<p class="meta"><b>' + esc(v.ch || ch.title || '') + '</b> · ' + esc(age(v.date)) + '</p></div></a>';
}
var groups = D.groups || [];
var videos = D.videos || [];
var selectedGroup = 'all';
var shownLimit = 12;
var PAGE_SIZE = 12;
var feedBuckets = [];
var renderedCount = 0;
var feedTotal = 0;
var thumbPending = false;
var thumbTimer = 0;
var categoryBar = document.getElementById('categories');
var options = [['all','Όλα']].concat(groups);
var navHtml = '';
for (var g = 0; g < options.length; g++) {
  var label = String(options[g][1]).split(' &')[0].split(',')[0];
  navHtml += '<button type="button" data-group="' + esc(options[g][0]) + '">' + esc(label) + '</button>';
}
categoryBar.innerHTML = navHtml;
function categoryButtons() { return categoryBar.querySelectorAll('button'); }
function activeCategory() { return categoryBar.querySelector('.active'); }
function loadVisibleThumbs() {
  thumbPending = false;
  thumbTimer = 0;
  if(!isOpen() || stageOpen()) return;
  var images = document.getElementById('grid').querySelectorAll('img[data-src]');
  var bottom = window.innerHeight + 160;
  for (var i=0;i<images.length;i++) {
    var img=images[i], r=img.getBoundingClientRect();
    if (r.bottom >= -200 && r.top <= bottom) {
      img.src=img.getAttribute('data-src');
      img.removeAttribute('data-src');
    }
  }
}
function scheduleThumbs() {
  if (thumbPending || !isOpen() || stageOpen()) return;
  thumbPending=true; thumbTimer=setTimeout(loadVisibleThumbs,60);
}
function renderFeed() {
  var buttons=categoryButtons(), g, n;
  for (var i=0;i<buttons.length;i++) {
    var active=buttons[i].getAttribute('data-group')===selectedGroup;
    buttons[i].className=active?'active':'';
    buttons[i].setAttribute('aria-pressed',active?'true':'false');
  }
  var known={};
  feedBuckets=[];
  feedTotal=0;
  renderedCount=0;
  for(g=0;g<groups.length;g++) {
    var gid=groups[g][0];
    known[gid]=true;
    if(selectedGroup!=='all'&&selectedGroup!==gid) continue;
    var bucket=[];
    for(n=0;n<videos.length;n++) if((chById[videos[n].chid]||{}).group===gid) bucket.push(videos[n]);
    if(bucket.length) feedBuckets.push({label:groups[g][1],videos:bucket.sort(rowSort),node:null,count:0});
  }
  if(selectedGroup==='all') {
    var other=videos.filter(function(v){return !known[(chById[v.chid]||{}).group];}).sort(rowSort);
    if(other.length) feedBuckets.push({label:'Άλλα',videos:other,node:null,count:0});
  }
  for(g=0;g<feedBuckets.length;g++) feedTotal+=feedBuckets[g].videos.length;
  document.getElementById('grid').innerHTML='';
  if(!feedTotal) {
    document.getElementById('grid').innerHTML='<p class="empty">Δεν υπάρχουν βίντεο.</p>';
    return;
  }
  appendCards();
}
function appendCards() {
  var grid=document.getElementById('grid');
  var more=document.getElementById('moreVideos');
  if(more) grid.removeChild(more);
  for(var k=0;k<feedBuckets.length&&renderedCount<shownLimit;k++) {
    var b=feedBuckets[k], html='';
    if(b.count>=b.videos.length) continue;
    if(!b.node) {
      var section=document.createElement('section');
      section.className='row';
      section.innerHTML='<h2>'+esc(b.label)+'</h2><div class="video-grid"></div>';
      grid.appendChild(section);
      b.node=section.lastChild;
    }
    while(b.count<b.videos.length&&renderedCount<shownLimit) {
      html+=cardHtml(b.videos[b.count++]);
      renderedCount++;
    }
    if(html) b.node.insertAdjacentHTML('beforeend',html);
  }
  if(renderedCount<feedTotal) {
    more=document.createElement('button');
    more.type='button';more.className='more';more.id='moreVideos';
    more.textContent='Περισσότερα ('+renderedCount+' / '+feedTotal+')';
    grid.appendChild(more);
  }
  loadVisibleThumbs();
}
function showMore() {
  if(renderedCount>=feedTotal) return;
  var oldCount=renderedCount;
  shownLimit+=PAGE_SIZE;
  appendCards();
  var next=cards()[oldCount];
  if(next) focusCard(next);
}
window.addEventListener('scroll',scheduleThumbs);
window.addEventListener('resize',scheduleThumbs);
categoryBar.addEventListener('click', function(e) {
  var t = e.target;
  if (!t || !t.getAttribute || t.getAttribute('data-group') === null) return;
  selectedGroup = t.getAttribute('data-group');
  shownLimit = PAGE_SIZE;
  renderFeed();
  window.scrollTo(0,0);
  t.focus();
});
document.getElementById('gen').textContent = D.generated_label || '';

var PIN_SHA = '9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0';
var pin = '';
var pinBusy = false;

function sha256ascii(ascii) {
  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }
  var maxWord = Math.pow(2, 32);
  var i, j, result = '', words = [], hash = [], k = [], primeCounter = 0, isComposite = {};
  var bitLength = ascii.length * 8;
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLength / maxWord) | 0;
  words[words.length] = bitLength;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
  }
  return result;
}
function sha256hex(text) {
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    var bytes;
    try {
      bytes = (window.TextEncoder ? new TextEncoder() : null);
      var data = bytes ? bytes.encode(text) : utf8bytes(text);
      return crypto.subtle.digest('SHA-256', data).then(function (buf) {
        var u = new Uint8Array(buf), hex = '';
        for (var i = 0; i < u.length; i++) hex += ((u[i] < 16) ? '0' : '') + u[i].toString(16);
        return hex;
      }, function () { return sha256ascii(text); });
    } catch (e) {}
  }
  return Promise.resolve(sha256ascii(text));
}
function utf8bytes(text) {
  var out = [];
  for (var i = 0; i < text.length; i++) {
    var c = text.charCodeAt(i);
    if (c < 128) out.push(c);
    else if (c < 2048) { out.push(192 | (c >> 6), 128 | (c & 63)); }
    else { out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  return new Uint8Array(out);
}
function isOpen() { return /(^|\s)open(\s|$)/.test(document.documentElement.className); }
function paintPin() {
  var s = '';
  for (var i = 0; i < 4; i++) s += i < pin.length ? '●' : '·';
  document.getElementById('dots').textContent = s;
}
function addDigit(d) {
  if (pin.length >= 4) return;
  pin += d;
  paintPin();
}
function pinFail() {
  pin = '';
  paintPin();
  var g = document.getElementById('gate');
  g.className = 'bad';
  setTimeout(function () { g.className = ''; }, 700);
}
function submitPin() {
  if (pinBusy) return;
  pinBusy = true;
  sha256hex(pin).then(function (hex) {
    pinBusy = false;
    if (hex === PIN_SHA) {
      try { localStorage.setItem('mif_tv_unlocked', '1'); } catch (e) {}
      document.documentElement.className = 'open';
      renderFeed();
      var first = activeCategory();
      if (first) first.focus();
    } else pinFail();
  });
}
document.getElementById('keys').addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var d = t.getAttribute('data-d');
  if (d) addDigit(d);
  else if (t.getAttribute('data-act') === 'del') { pin = pin.slice(0, -1); paintPin(); }
  else if (t.getAttribute('data-act') === 'ok') submitPin();
});

function cards() {
  return document.querySelectorAll('a.card');
}
function keys() {
  return document.querySelectorAll('#keys button');
}
function move(all, dir) {
  var cur = document.activeElement;
  var inside = false;
  for (var n = 0; n < all.length; n++) if (all[n] === cur) inside = true;
  if (!inside) {
    if (all.length) all[0].focus();
    return;
  }
  var r = cur.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  var best = null, bestD = 1e15;
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    if (el === cur) continue;
    var b = el.getBoundingClientRect();
    var dx = (b.left + b.width / 2) - cx;
    var dy = (b.top + b.height / 2) - cy;
    if (dir === 37 && dx >= -4) continue;
    if (dir === 39 && dx <= 4) continue;
    if (dir === 38 && dy >= -4) continue;
    if (dir === 40 && dy <= 4) continue;
    var primary = (dir === 37 || dir === 39) ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir === 37 || dir === 39) ? Math.abs(dy) : Math.abs(dx);
    var dist = primary + secondary * 1.5;
    if (dist < bestD) { bestD = dist; best = el; }
  }
  if (!best) return;
  best.focus();
}
function focusCard(el) {
  el.focus();
  if(String(el.href||'').indexOf('https://www.youtube.com/watch')===0) warmPlayer();
  var r = el.getBoundingClientRect();
  var top = categoryBar.getBoundingClientRect().bottom + 12;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  if (r.top < top) window.scrollTo(0, Math.max(0, y + r.top - top));
  else if (r.bottom > window.innerHeight - 14) window.scrollTo(0, y + r.bottom - window.innerHeight + 14);
}
function moveCard(dir) {
  var cur = document.activeElement, all = cards(), buttons = categoryButtons();
  var inNav = cur && cur.parentNode === categoryBar;
  if (inNav) {
    if (dir === 37 || dir === 39) {
      var i = Array.prototype.indexOf.call(buttons, cur);
      var next = buttons[i + (dir === 39 ? 1 : -1)];
      if (next) next.focus();
    } else if (dir === 40 && all.length) focusCard(all[0]);
    return;
  }
  if (!cur || !cur.classList || !cur.classList.contains('card')) {
    if (activeCategory()) activeCategory().focus();
    return;
  }
  var r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  var best = null, score = Infinity;
  for (var j = 0; j < all.length; j++) {
    var el = all[j];
    if (el === cur) continue;
    var b = el.getBoundingClientRect(), dx = b.left + b.width/2 - cx, dy = b.top + b.height/2 - cy;
    if ((dir === 37 && dx >= -4) || (dir === 39 && dx <= 4) ||
        (dir === 38 && dy >= -4) || (dir === 40 && dy <= 4)) continue;
    if ((dir === 37 || dir === 39) && Math.abs(dy) > r.height/2) continue;
    var d = dir === 37 || dir === 39 ? Math.abs(dx) + 3*Math.abs(dy) : Math.abs(dy) + 2*Math.abs(dx);
    if (d < score) { score = d; best = el; }
  }
  if (best) focusCard(best);
  else if (dir === 40 && shownLimit < feedTotal) showMore();
  else if (dir === 38 && activeCategory()) { window.scrollTo(0,0); activeCategory().focus(); }
}
var returnCard = null, playerHistory = false, returnScroll = 0, warmed = false;
function warmPlayer() {
  if(warmed) return;
  warmed=true;
  var link=document.createElement('link');
  link.rel='preconnect';link.href='https://www.youtube-nocookie.com';
  document.head.appendChild(link);
}
var stage = document.getElementById('stage');
var frame = document.getElementById('yt');
var toolbar = document.getElementById('playerTools');
var fullscreenButton = document.getElementById('playerFullscreen');
function stageOpen() { return stage && stage.className.indexOf('off') === -1; }
function safeRumbleEmbed(url) {
  var s = String(url || '');
  return /^https:\/\/rumble\.com\/embed\/[A-Za-z0-9._-]+\/?(?:\?[^#\s]*)?$/.test(s) ? s : '';
}
function playerSource(card) {
  var href=card.getAttribute('href') || card.href || '';
  if(href.indexOf('https://www.youtube.com/watch')===0) {
    var id=ytIdFrom(href);
    if(id) return {name:'YouTube',url:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&controls=1&fs=1&disablekb=0&playsinline=1'};
  }
  var embed=safeRumbleEmbed(card.getAttribute('data-embed'));
  if(embed && /^https:\/\/rumble\.com\//.test(href)) {
    return {name:'Rumble',url:embed};
  }
  return null;
}
function ytIdFrom(href) {
  var match = String(href || '').match(/[?&]v=([A-Za-z0-9_-]{11})(?:[&#]|$)/);
  return match ? match[1] : '';
}
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || null;
}
function requestFullscreen() {
  var fn = stage.requestFullscreen || stage.webkitRequestFullscreen || stage.webkitRequestFullScreen;
  if (!fn) return;
  try { var result = fn.call(stage); if (result && result.catch) result.catch(function(){}); } catch(e) {}
}
function exitFullscreen() {
  var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
  if (!fn || !fullscreenElement()) return;
  try { var result = fn.call(document); if (result && result.catch) result.catch(function(){}); } catch(e) {}
}
function updateFullscreenLabel() {
  fullscreenButton.textContent = fullscreenElement() ? 'Έξοδος fullscreen' : 'Fullscreen';
}
document.addEventListener('fullscreenchange', updateFullscreenLabel);
document.addEventListener('webkitfullscreenchange', updateFullscreenLabel);
function showTools() { stage.className=''; toolbar.classList.add('visible'); }
function hideTools() { toolbar.classList.remove('visible'); }
function focusNative() {
  hideTools();
  stage.className='native';
  frame.focus();
  try { frame.contentWindow.focus(); } catch(e) {}
}
function openPlayer(card) {
  var source = playerSource(card);
  if (!source) return;
  returnCard = card;
  returnScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
  if(thumbTimer) clearTimeout(thumbTimer);
  thumbPending=false;thumbTimer=0;
  if(source.name==='YouTube') warmPlayer();
  document.documentElement.className = 'open playing';
  stage.className = '';
  frame.title=source.name;
  document.getElementById('playerExternal').textContent=source.name;
  frame.src=source.url;
  try { history.pushState({mifTVPlayer:true}, '', location.href); playerHistory = true; } catch(e) { playerHistory = false; }
  hideTools();
  document.getElementById('revealTools').focus();
}
function closePlayer(fromHistory) {
  if (!stageOpen()) return;
  exitFullscreen();
  frame.src = 'about:blank';
  stage.className = 'off';
  hideTools();
  document.documentElement.className = 'open';
  window.scrollTo(0,returnScroll);
  if (returnCard) focusCard(returnCard);
  scheduleThumbs();
  if (!fromHistory && playerHistory && history.state && history.state.mifTVPlayer) history.back();
  playerHistory = false;
  if(typeof applyTV==='function') applyTV();
}
window.addEventListener('popstate', function() { if (stageOpen()) closePlayer(true); });
document.getElementById('revealTools').addEventListener('click', function() {
  showTools(); document.getElementById('playerControls').focus();
});
toolbar.addEventListener('focusin', showTools);
frame.addEventListener('focus', function(){hideTools();if(stageOpen())stage.className='native';});
window.addEventListener('blur', function() {
  if (stageOpen()) setTimeout(function() { if (document.activeElement === frame) hideTools(); }, 0);
});
document.getElementById('playerControls').addEventListener('click', focusNative);
fullscreenButton.addEventListener('click', function() {
  if (fullscreenElement()) exitFullscreen(); else requestFullscreen();
});
document.getElementById('playerClose').addEventListener('click', function() { closePlayer(false); });
document.getElementById('playerExternal').addEventListener('click', function() {
  if (returnCard) { exitFullscreen(); location.replace(returnCard.href); }
});
document.getElementById('grid').addEventListener('click', function (e) {
  if(e.target && e.target.id==='moreVideos'){showMore();return;}
  var a = e.target;
  while (a && a.tagName !== 'A') a = a.parentNode;
  if (!a || !a.getAttribute) return;
  if (playerSource(a)) {
    e.preventDefault();
    openPlayer(a);
  }
});
document.addEventListener('keydown', function (e) {
  var code = e.keyCode || e.which || 0;
  if (!code) {
    if (e.key === 'ArrowLeft') code = 37;
    else if (e.key === 'ArrowUp') code = 38;
    else if (e.key === 'ArrowRight') code = 39;
    else if (e.key === 'ArrowDown') code = 40;
    else if (e.key === 'Enter') code = 13;
    else if (e.key === 'Escape') code = 27;
    else if (e.key === 'Backspace') code = 8;
  }
  if (stageOpen()) {
    if (code === 461 || code === 27 || code === 8 || e.key === 'BrowserBack') {
      e.preventDefault(); closePlayer(false); return;
    }
    if (code === 40) { e.preventDefault(); focusNative(); return; }
    if (code === 37 || code === 39 || code === 38) {
      e.preventDefault(); showTools(); move(toolbar.querySelectorAll('button'), code); return;
    }
    if (code === 13 && document.activeElement && document.activeElement.tagName === 'BUTTON') {
      e.preventDefault(); document.activeElement.click();
    }
    return;
  }
  if (!isOpen()) {
    var digit = -1;
    if (code >= 48 && code <= 57) digit = code - 48;
    else if (code >= 96 && code <= 105) digit = code - 96;
    else if (!code && e.key && e.key.length === 1 && e.key >= '0' && e.key <= '9') digit = e.key;
    if (digit !== -1 && digit !== '-1') {
      e.preventDefault();
      addDigit(String(digit));
      return;
    }
    if (code >= 37 && code <= 40) {
      e.preventDefault();
      move(keys(), code);
      return;
    }
    if (code === 13) {
      e.preventDefault();
      var cur = document.activeElement;
      if (cur && cur.click) cur.click();
    }
    return;
  }
  if (code >= 37 && code <= 40) {
    e.preventDefault();
    moveCard(code);
    return;
  }
  if (code === 13) {
    var card = document.activeElement;
    if (!card || !card.getAttribute) return;
    if (card.tagName === 'BUTTON') { e.preventDefault(); card.click(); return; }
    var href = card.getAttribute('href') || '';
    if (playerSource(card)) {
      e.preventDefault();
      openPlayer(card);
    } else if (card.href) {
      window.location.href = card.href;
    }
  }
});
// Poll the published snapshot without interrupting playback or the PIN screen.
var pendingTV = null, tvBusy = false;
function applyTV() {
  if(!pendingTV || !isOpen() || stageOpen()) return;
  var next = pendingTV; pendingTV = null;
  var old = document.activeElement, href = old && old.getAttribute && old.getAttribute('href');
  var y = window.pageYOffset || 0;
  D = next; channels = D.channels; videos = D.videos; chById = {};
  for(var n=0;n<channels.length;n++) chById[channels[n].id]=channels[n];
  document.getElementById('gen').textContent = D.generated_label || '';
  renderFeed(); window.scrollTo(0,y);
  if(href) {
    var all=cards();
    for(var j=0;j<all.length;j++) if(all[j].getAttribute('href')===href){all[j].focus();return;}
  }
  if(activeCategory()) activeCategory().focus();
}
function refreshTV() {
  applyTV();
  if(tvBusy || document.hidden) return;
  tvBusy=true;
  var xhr=new XMLHttpRequest();
  xhr.open('GET','../data.json?t='+Date.now(),true);
  xhr.timeout=15000;
  xhr.onload=function(){
    tvBusy=false;
    if(xhr.status!==200) return;
    try {
      var next=JSON.parse(xhr.responseText);
      if(next.generated && next.generated!==D.generated && Array.isArray(next.videos) && Array.isArray(next.channels)){
        pendingTV=next; applyTV();
      }
    } catch(e){}
  };
  xhr.onerror=xhr.ontimeout=function(){tvBusy=false;};
  xhr.send();
}
setInterval(refreshTV,5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) refreshTV();});
window.addEventListener('online',refreshTV);
if (isOpen()) {
  renderFeed();
  var firstCard = activeCategory();
  if (firstCard) firstCard.focus();
} else {
  var firstKey = keys()[0];
  if (firstKey) firstKey.focus();
}
</script>
